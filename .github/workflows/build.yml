name: Build DiskMap

# Every push to main is compiled, so a broken build shows up here before anyone installs it.
# When VERSION in build.sh changes to a number that hasn't been released yet, the build is
# published as a GitHub release (tag v<VERSION>) with a ready-to-run DiskMap.zip.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6

      - name: Show the tools
        run: |
          sw_vers
          xcrun swiftc --version

      - name: Build for Apple silicon and Intel
        shell: bash
        run: bash build.sh --no-install --universal 2>&1 | tee build.log

      - name: Point at compile errors
        if: failure()
        shell: bash
        run: |
          grep -E '^[^ ]+\.swift:[0-9]+:[0-9]+: error: ' build.log | sort -u | head -10 | while IFS= read -r line; do
            file=$(printf '%s' "$line" | cut -d: -f1)
            row=$(printf '%s' "$line" | cut -d: -f2)
            col=$(printf '%s' "$line" | cut -d: -f3)
            msg=$(printf '%s' "$line" | cut -d: -f5- | sed -e 's/^ //' -e 's/%/%25/g')
            echo "::error file=${file#"$GITHUB_WORKSPACE/"},line=$row,col=$col::$msg"
          done

      - name: Zip the app
        run: |
          cd build
          ditto -c -k --keepParent DiskMap.app DiskMap.zip
          shasum -a 256 DiskMap.zip

      - uses: actions/upload-artifact@v6
        with:
          name: DiskMap
          path: build/DiskMap.zip

      - name: Read the version
        id: version
        shell: bash
        run: |
          version=$(sed -n 's/^VERSION="\(.*\)"$/\1/p' build.sh)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "v$version is already released; nothing to publish."
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish a release for a new version
        if: github.ref == 'refs/heads/main' && steps.version.outputs.released == 'false'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: DiskMap ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          body_path: .github/release-notes.md
          files: build/DiskMap.zip
          fail_on_unmatched_files: true
          make_latest: true

      - name: Attach to a release tagged by hand
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          body_path: .github/release-notes.md
          files: build/DiskMap.zip
