name: Signing self-test

# Proves on a real Mac that the signing setup works, using a throwaway key made by the same
# script you run: the key loads, build.sh signs with it, the signed app runs, and a later
# build signed with the same key is recognized as the same app.
on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'Tests/**'
      - 'Sources/CodeSigning.swift'
      - 'build.sh'
      - '.github/workflows/signing-test.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6

      - name: Make a throwaway key with the setup script
        run: |
          DISKMAP_SIGNING_OUTPUT="$RUNNER_TEMP/key.b64" bash scripts/setup-signing.sh
          echo "SIGNING_CERTIFICATE=$(cat "$RUNNER_TEMP/key.b64")" >> "$GITHUB_ENV"
          echo "::notice::PASS setup-signing.sh made a key ($(wc -c < "$RUNNER_TEMP/key.b64") characters)"

      - name: Load it the way release builds do
        run: bash scripts/import-signing-key.sh

      - name: Build and sign with it
        shell: bash
        run: |
          bash build.sh --no-install 2>&1 | tee build.log
          codesign -dv build/DiskMap.app 2>&1 | grep -E '^(Identifier|Authority)=' | while read -r line; do echo "::notice::$line"; done

      - name: The signed app runs
        run: |
          perl -e 'alarm 60; exec @ARGV' build/DiskMap.app/Contents/MacOS/DiskMap --background-check
          echo "::notice::PASS a key-signed DiskMap starts and exits normally"

      - name: Make a second signed build and an ad hoc one
        run: |
          cp -R build/DiskMap.app "$RUNNER_TEMP/signed.app"
          cp -R build/DiskMap.app "$RUNNER_TEMP/resigned.app"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion test-2" "$RUNNER_TEMP/resigned.app/Contents/Info.plist"
          codesign --force --deep --timestamp=none --sign "$SIGN_IDENTITY" --keychain "$SIGN_KEYCHAIN" \
            --identifier io.github.mmzeller.DiskMap "$RUNNER_TEMP/resigned.app"
          cp -R build/DiskMap.app "$RUNNER_TEMP/adhoc.app"
          codesign --force --deep --sign - --identifier io.github.mmzeller.DiskMap "$RUNNER_TEMP/adhoc.app"
          codesign --verify --deep --strict "$RUNNER_TEMP/resigned.app"
          codesign --verify --deep --strict "$RUNNER_TEMP/adhoc.app"

      - name: Check what the updater and macOS rely on
        run: |
          swiftc -O Sources/CodeSigning.swift Tests/SigningCheck/main.swift -o "$RUNNER_TEMP/signing-check"
          "$RUNNER_TEMP/signing-check" "$RUNNER_TEMP/signed.app" "$RUNNER_TEMP/resigned.app" "$RUNNER_TEMP/adhoc.app"
